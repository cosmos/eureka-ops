name: deploy
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    env:
      FOUNDRY_ETH_RPC_URL: http://localhost:8545
      DEPLOYMENT_ENV: local
      # Non-interactive client ID for DeploySP1ICS07Tendermint.sol (empty = new deployment)
      CLIENT_ID: ""
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: "Set up environment"
        uses: ./.github/setup
      - name: Deploy Anvil
        run: |
          anvil &
      - name: Deploy contracts
        run: |
          forge script script/DeployV3Core.sol:DeployV3Core -vvv --broadcast --private-key ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
          forge script script/DeploySP1ICS07Tendermint.sol -vvv --broadcast --private-key ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
          forge script script/PauseTransfers.sol -vvv --broadcast --private-key ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
          forge script script/UnpauseTransfers.sol -vvv --broadcast --private-key 59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d
      - name: Show final result
        run: |
          cat deployments/local/31337.json
  gather-deploys:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set deployment matrix
        id: matrix
        run: |
          cd deployments/
          echo "matrix=$(ls */*.json | jq -R -r -s -c '{include: [split("\n")[:-1] | .[] | split("/") | {env: .[0], file: .[1]} | select (.env != "local")]}')" >> $GITHUB_OUTPUT
  verify:
    runs-on: ubuntu-latest
    needs: gather-deploys
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gather-deploys.outputs.matrix) }}
    env:
      DEPLOYMENT_ENV: "${{ matrix.env }}"
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: "Set up environment"
        uses: ./.github/setup
      - name: Prepare verification
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        run: |
          set -euo pipefail

          deployment="deployments/${{ matrix.env }}/${{ matrix.file }}"
          if ! access_manager=$(jq -er '.accessManager | strings' "$deployment"); then
            echo "::error file=$deployment::accessManager must be present before deployment verification."
            exit 1
          fi

          if [ "$access_manager" = "0x0000000000000000000000000000000000000000" ]; then
            echo "::error file=$deployment::accessManager must not be the zero address."
            exit 1
          fi

          # The chain id is the deployment file name: deployments/<env>/<chain_id>.json
          chain_id="$(basename "${{ matrix.file }}" .json)"
          case "$chain_id" in
            1)        rpc_url="$MAINNET_RPC_URL" ;;
            11155111) rpc_url="$SEPOLIA_RPC_URL" ;;
            *) echo "::error::No RPC URL mapping for chain id ${chain_id}"; exit 1 ;;
          esac
          if [ -z "$rpc_url" ]; then
            echo "::error::RPC URL for chain id ${chain_id} is not set. Add the MAINNET_RPC_URL / SEPOLIA_RPC_URL repository secrets."
            exit 1
          fi
          echo "FOUNDRY_ETH_RPC_URL=${rpc_url}" >> "$GITHUB_ENV"
      - name: Verify deployed contracts
        run: |
          forge script script/VerifyDeployment.sol:VerifyDeployment -vvv
