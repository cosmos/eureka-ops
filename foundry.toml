# Full reference https://github.com/foundry-rs/foundry/tree/master/crates/config

[profile.default]
  auto_detect_solc = false
  block_timestamp = 1_680_220_800 # March 31, 2023 at 00:00 GMT
  bytecode_hash = "none"
  evm_version = "cancun"
  fuzz = { runs = 100_000 }
  gas_reports = ["*"]
  optimizer = true
  via_ir = true # This is needed because of the `sp1-ics07-tendermint` contract
  optimizer_runs = 10_000
  out = "out"
  script = "script"
  solc = "0.8.28"
  src = "contracts"
  test = "test"
  fs_permissions = [{ access = "read-write", path = "./" },]

# The Safe contracts (used only by tests to rehearse the v3 upgrade as an atomic Safe MultiSend) hit a
# via_ir "stack too deep" in Safe.execTransaction. Compile only that dependency without via_ir; the rest of
# the project keeps via_ir = true (needed for the sp1-ics07-tendermint contract).
[[profile.default.additional_compiler_profiles]]
  name = "safe-no-via-ir"
  via_ir = false

[[profile.default.compilation_restrictions]]
  paths = "node_modules/@safe-global/safe-smart-account/contracts/**"
  via_ir = false

[fmt]
  bracket_spacing = true
  int_types = "long"
  line_length = 120
  multiline_func_header = "all"
  number_underscore = "thousands"
  quote_style = "double"
  tab_width = 4
  wrap_comments = true

